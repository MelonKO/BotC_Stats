name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  test-core-api:
    name: Test Core API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/api
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-core-api-${{ hashFiles('core/api/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-core-api-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest app/tests/ -v
