name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  test-uploader:
    name: Test Uploader (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: uploader
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-uploader-${{ hashFiles('uploader/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-uploader-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v

  test-core-api:
    name: Test Core API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-core-api-${{ hashFiles('core/api/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-core-api-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v
