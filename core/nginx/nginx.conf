worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 64;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;

    # Logging
    log_format api_format '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log api_format;

    # Upstream — FastAPI container
    upstream api_backend {
        server api:8000;
    }

    # Upstream — Metabase container
    upstream metabase_backend {
        server metabase:3000;
    }

    # Rate limiting per IP
    # Write operations (game/role import) — strict limit to prevent staging table overload
    limit_req_zone $binary_remote_addr zone=import_limit:10m rate=30r/m;
    # Read operations (roles, players, stats) — generous limit for bots and multiple clients
    limit_req_zone $binary_remote_addr zone=read_limit:10m rate=120r/m;

    # Security headers (X-Frame-Options set per-location to allow Metabase embedding)
    add_header X-Content-Type-Options nosniff always;

    # ============================================================
    #  HTTPS server (port 443)
    # ============================================================
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Import endpoints — write operations
        location /api/games/import {
            limit_req zone=import_limit burst=20 nodelay;

            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /api/roles/import {
            limit_req zone=import_limit burst=20 nodelay;

            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Read endpoints — roles, players, future stats
        location /api/ {
            limit_req zone=read_limit burst=30 nodelay;

            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Health check endpoint (no rate limit)
        location /health {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
        }

        # API documentation
        # API schema
        location /openapi.json {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
        }
        # docs
        location /docs {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
        }

        # Metabase admin UI — proxied with sub-path stripping
        location /stats/ {
            proxy_pass         http://metabase_backend/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 300s;
            add_header         X-Frame-Options   "SAMEORIGIN" always;
            add_header         X-Content-Type-Options nosniff always;
        }

        # Public embed page — served as a static file, no login required
        location /view/ {
            root  /etc/nginx/html;
            index embed.html;
            try_files $uri $uri/ /view/embed.html;
            add_header X-Frame-Options   "SAMEORIGIN" always;
            add_header X-Content-Type-Options nosniff always;
        }

        # Block everything else
        location / {
            return 404 '{"error": "Not found"}';
            add_header Content-Type application/json;
            add_header X-Frame-Options DENY always;
        }
    }

    # ============================================================
    #  HTTP server (port 80) — redirect to HTTPS
    # ============================================================
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }
}
