openapi: "3.0.3"

info:
  title: BotC Import API
  description: API for importing Blood on the Clocktower game records
  version: "1.0.0"

servers:
  - url: https://{ip}
    variables:
      ip:
        default: "localhost"

# ============================================================
#  Security & Schemas
# ============================================================

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    # ------------------------------------------------------------
    # Requests
    # ------------------------------------------------------------
    GameImportRequest:
      type: object
      description: Full game import request.
      required:
        - game_date
        - scenario_name
        - storyteller_names
        - alignment_win
        - location
        - game_number
        - players
      properties:
        game_date:
          type: string
          format: date
          example: "2026-01-15"
        scenario_name:
          type: string
          minLength: 1
          maxLength: 300
          example: "Вселенная зла"
        storyteller_names:
          type: array
          description: Names of the storyteller(s) running this game (more than one for co-storytelling).
          minItems: 1
          maxItems: 5
          items:
            type: string
            minLength: 1
            maxLength: 200
          example: ["МелонКО"]
        alignment_win:
          type: string
          pattern: "^(добро|зло|ничья)$"
          example: "добро"
        location:
          type: string
          minLength: 1
          maxLength: 300
          example: "Москва, Антикафе на Арбате"
        game_number:
          type: integer
          minimum: 1
          example: 1
        duration:
          type: string
          nullable: true
          example: "01:30:00"
        notes:
          type: string
          nullable: true
          maxLength: 2000
          example: "Отличная партия, все получили удовольствие"
        players:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: "#/components/schemas/PlayerImportRequest"

    GamesImportRequest:
      type: object
      description: Batch game import request.
      required:
        - games
      properties:
        games:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/GameImportRequest"

    RoleImportItem:
      type: object
      description: A single role entry in a roles import request.
      required:
        - name
        - alignment
        - role_type
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: "Chambermaid"
        alignment:
          type: string
          pattern: "^(good|evil|neutral)$"
          example: "good"
        role_type:
          type: string
          pattern: "^(Townsfolk|Outsider|Minion|Demon|Traveller)$"
          example: "Outsider"
        description:
          type: string
          nullable: true
          maxLength: 2000
          example: "Simple, but not harmless"
        translations:
          type: object
          nullable: true
          additionalProperties:
            $ref: "#/components/schemas/RoleTranslation"
          example:
            ru:
              name: "Дамочка"
              description: "Служанка, которая следит за гостями"

    RolesImportRequest:
      type: object
      description: Full roles import request.
      required:
        - roles
      properties:
        roles:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/RoleImportItem"

    # ------------------------------------------------------------
    # Responses
    # ------------------------------------------------------------
    HealthResponse:
      type: object
      required:
        - status
        - db_connected
      properties:
        status:
          type: string
          enum: [ ok, degraded ]
          example: "ok"
        db_connected:
          type: boolean
          example: true

    GameImportStatusResponse:
      type: object
      required:
        - status
        - players_created
        - errors
      properties:
        status:
          type: string
          example: "ok"
        game_id:
          type: string
          nullable: true
          example: "42"
        players_created:
          type: integer
          default: 0
          example: 5
        errors:
          type: array
          items:
            type: string
          default: [ ]

    GamesImportStatusResponse:
      type: object
      properties:
        games:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/GameImportStatusResponse"

    RolesResponse:
      type: object
      required:
        - roles
      properties:
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleItem"

    RolesImportResponse:
      type: object
      required:
        - status
        - roles_created
        - roles_updated
        - errors
      properties:
        status:
          type: string
          example: "ok"
        roles_created:
          type: integer
          default: 0
          example: 3
        roles_updated:
          type: integer
          default: 0
          example: 1
        errors:
          type: array
          items:
            type: string
          default: [ ]

    PlayersResponse:
      type: object
      required:
        - players
      properties:
        players:
          type: array
          items:
            $ref: "#/components/schemas/PlayerItem"

    # ------------------------------------------------------------
    # Common
    # ------------------------------------------------------------
    RoleItem:
      type: object
      description: Role record from the database.
      required:
        - id
        - name
        - alignment
        - role_type
      properties:
        id:
          type: string
          format: uuid
          example: "a09f3ff7-0f02-485a-b0e1-87388b27face"
        name:
          type: string
          example: "Chambermaid"
        alignment:
          type: string
          pattern: "^(good|evil|neutral)$"
          example: "good"
        role_type:
          type: string
          pattern: "^(Townsfolk|Outsider|Minion|Demon|Traveller)$"
          example: "Outsider"
        description:
          type: string
          nullable: true
          example: "Simple, but not harmless"
        translation:
          description: Translation into the requested language (only present when the lang query parameter was provided).
          nullable: true
          allOf:
            - $ref: "#/components/schemas/RoleTranslation"

    RoleTranslation:
      type: object
      description: Translation of a single role into one language.
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: "Дамочка"
        description:
          type: string
          nullable: true
          maxLength: 2000
          example: "Служанка, которая следит за гостями"

    ErrorResponse:
      type: object
      required:
        - detail
      properties:
        detail:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true

    PlayerImportRequest:
      type: object
      description: A single player entry in a game import request.
      required:
        - name
        - role_start
        - role_end
        - alignment_end
        - is_alive
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          example: "Мая Вишневская"
        seat_number:
          type: integer
          minimum: 1
          nullable: true
          example: 1
        role_start:
          type: string
          minLength: 1
          maxLength: 200
          example: "Дамочка"
        role_end:
          type: string
          minLength: 1
          maxLength: 200
          example: "Дамочка"
        alignment_end:
          type: string
          pattern: "^(добро|зло|нейтральный)$"
          example: "добро"
        is_alive:
          type: boolean
          example: true

    PlayerItem:
      type: object
      description: Player record from the database.
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          example: "b1c2d3e4-f5a6-7890-abcd-1234567890ef"
        name:
          type: string
          example: "Alice"

# ============================================================
#  Paths
# ============================================================

paths:
  /health:
    get:
      operationId: health
      summary: Health check
      description: Check service health and database connectivity.
      tags: [ System ]
      responses:
        "200":
          description: Service is running (possibly in degraded mode).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/games/import:
    post:
      operationId: importGame
      summary: Import a game
      description: |
        Import a single game into the database.
        Requires a valid API key in the X-API-Key header.
      tags: [ Games ]
      security:
        - ApiKeyAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameImportRequest"
      responses:
        "200":
          description: Game imported successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameImportStatusResponse"
        "400":
          description: Import error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/games/import_batch:
    post:
      operationId: importGames
      summary: Import multiple games
      description: |
        Import multiple games into the database.
        Requires a valid API key in the X-API-Key header.
      tags:
        - Games
      security:
        - ApiKeyAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GamesImportRequest"
      responses:
        "200":
          description: Games imported successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GamesImportStatusResponse"
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/roles:
    get:
      operationId: listRoles
      summary: List roles
      description: |
        Return all available roles.
        If the `lang` parameter is provided, each role will include
        a translation in the `translation` field.
        Requires a valid API key in the X-API-Key header.
      tags: [ Roles ]
      security:
        - ApiKeyAuth: [ ]
      parameters:
        - name: lang
          in: query
          required: false
          description: |
            Language code for role translations (e.g. `ru`, `de`, `jp`).
            If the language is not found, the `translation` field will be `null`.
          schema:
            type: string
            minLength: 2
            maxLength: 5
            example: "ru"
      responses:
        "200":
          description: List of roles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolesResponse"
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/roles/import:
    post:
      operationId: importRoles
      summary: Import roles
      description: |
        Upsert a list of roles into the database.
        Existing roles are updated; new ones are created.
        Requires a valid API key in the X-API-Key header.
      tags: [ Roles ]
      security:
        - ApiKeyAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RolesImportRequest"
      responses:
        "200":
          description: Roles imported successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolesImportResponse"
        "400":
          description: Import error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/players:
    get:
      operationId: listPlayers
      summary: List players
      tags: [ Players ]
      security:
        - ApiKeyAuth: [ ]
      responses:
        "200":
          description: List of players.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayersResponse"
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
