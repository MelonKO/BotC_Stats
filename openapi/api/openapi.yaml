openapi: "3.0.3"

info:
  title: BotC Import API
  description: API for importing Blood on the Clocktower game records
  version: "1.0.0"

servers:
  - url: https://{ip}
    variables:
      ip:
        default: "localhost"

# ============================================================
#  Security
# ============================================================

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

  schemas:
    # requests
    GameImportRequest: { $ref: "./schemas/requests.yaml#/GameImportRequest" }
    GamesImportRequest: { $ref: "./schemas/requests.yaml#/GamesImportRequest" }
    RoleImportItem: { $ref: "./schemas/requests.yaml#/RoleImportItem" }
    RolesImportRequest: { $ref: "./schemas/requests.yaml#/RolesImportRequest" }

    # responses
    HealthResponse: { $ref: "./schemas/responses.yaml#/HealthResponse" }
    GameImportStatusResponse: { $ref: "./schemas/responses.yaml#/GameImportStatusResponse" }
    GamesImportStatusResponse: {$ref: "./schemas/responses.yaml#/GamesImportStatusResponse" }
    RolesResponse: { $ref: "./schemas/responses.yaml#/RolesResponse" }
    RolesImportResponse: { $ref: "./schemas/responses.yaml#/RolesImportResponse" }
    PlayersResponse: { $ref: "./schemas/responses.yaml#/PlayersResponse" }

    # common
    RoleItem: { $ref: "./schemas/common.yaml#/RoleItem" }
    RoleTranslation: { $ref: "./schemas/common.yaml#/RoleTranslation" }
    ErrorResponse: { $ref: "./schemas/common.yaml#/ErrorResponse" }

# ============================================================
#  Paths
# ============================================================

paths:
  /health:
    get:
      operationId: health
      summary: Health check
      description: Check service health and database connectivity.
      tags: [ System ]
      responses:
        "200":
          description: Service is running (possibly in degraded mode).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/games/import:
    post:
      operationId: importGame
      summary: Import a game
      description: |
        Import a single game into the database.
        Requires a valid API key in the X-API-Key header.
      tags: [ Games ]
      security:
        - ApiKeyAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameImportRequest"
      responses:
        "200":
          description: Game imported successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameImportStatusResponse"
        "400":
          description: Import error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/games/import_batch:
    post:
      operationId: importGames
      summary: Import multiple games
      description: |
        Import multiple games into the database.
        Requires a valid API key in the X-API-Key header.
      tags:
        - Games
      security:
        - ApiKeyAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GamesImportRequest"
      responses:
        "200":
          description: Games imported successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GamesImportStatusResponse"
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/roles:
    get:
      operationId: listRoles
      summary: List roles
      description: |
        Return all available roles.
        If the `lang` parameter is provided, each role will include
        a translation in the `translation` field.
        Requires a valid API key in the X-API-Key header.
      tags: [ Roles ]
      security:
        - ApiKeyAuth: [ ]
      parameters:
        - name: lang
          in: query
          required: false
          description: |
            Language code for role translations (e.g. `ru`, `de`, `jp`).
            If the language is not found, the `translation` field will be `null`.
          schema:
            type: string
            minLength: 2
            maxLength: 5
            example: "ru"
      responses:
        "200":
          description: List of roles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolesResponse"
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/roles/import:
    post:
      operationId: importRoles
      summary: Import roles
      description: |
        Upsert a list of roles into the database.
        Existing roles are updated; new ones are created.
        Requires a valid API key in the X-API-Key header.
      tags: [ Roles ]
      security:
        - ApiKeyAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RolesImportRequest"
      responses:
        "200":
          description: Roles imported successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolesImportResponse"
        "400":
          description: Import error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/players:
    get:
      operationId: listPlayers
      summary: List players
      tags: [ Players ]
      security:
        - ApiKeyAuth: [ ]
      responses:
        "200":
          description: List of players.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayersResponse"
        "401":
          description: Missing or invalid API key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
