RoleTranslation:
  type: object
  description: Translation of a single role into one language.
  required:
    - name
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 200
      example: "Дамочка"
    description:
      type: string
      nullable: true
      maxLength: 2000
      example: "Служанка, которая следит за гостями"

RoleItem:
  type: object
  description: Role record from the database.
  required:
    - id
    - name
    - alignment
    - role_type
  properties:
    id:
      type: string
      format: uuid
      example: "a09f3ff7-0f02-485a-b0e1-87388b27face"
    name:
      type: string
      example: "Chambermaid"
    alignment:
      type: string
      pattern: "^(good|evil|neutral)$"
      example: "good"
    role_type:
      type: string
      pattern: "^(Townsfolk|Outsider|Minion|Demon|Traveller)$"
      example: "Outsider"
    description:
      type: string
      nullable: true
      example: "Simple, but not harmless"
    translation:
      description: Translation into the requested language (only present when the lang query parameter was provided).
      nullable: true
      $ref: "#/RoleTranslation"

PlayerItem:
  type: object
  description: Player record from the database.
  required:
    - id
    - name
  properties:
    id:
      type: string
      format: uuid
      example: "b1c2d3e4-f5a6-7890-abcd-1234567890ef"
    name:
      type: string
      example: "Alice"

ErrorResponse:
  type: object
  required:
    - detail
  properties:
    detail:
      oneOf:
        - type: string
        - type: object
          additionalProperties: true
