PlayerImportRequest:
  type: object
  description: Один игрок в запросе импорта.
  required:
    - name
    - role_start
    - role_end
    - alignment_end
    - is_alive
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 200
      example: "Мая Вишневская"
    seat_number:
      type: integer
      minimum: 1
      nullable: true
      example: 1
    role_start:
      type: string
      minLength: 1
      maxLength: 200
      example: "Дамочка"
    role_end:
      type: string
      minLength: 1
      maxLength: 200
      example: "Дамочка"
    alignment_end:
      type: string
      pattern: "^(добро|зло|нейтральный)$"
      example: "добро"
    is_alive:
      type: boolean
      example: true

GameImportRequest:
  type: object
  description: Полный запрос импорта партии.
  required:
    - game_date
    - scenario_name
    - storyteller_name
    - alignment_win
    - location
    - game_number
    - players
  properties:
    game_date:
      type: string
      format: date
      example: "2026-01-15"
    scenario_name:
      type: string
      minLength: 1
      maxLength: 300
      example: "Вселенная зла"
    storyteller_name:
      type: string
      minLength: 1
      maxLength: 200
      example: "МелонКО"
    alignment_win:
      type: string
      pattern: "^(добро|зло)$"
      example: "добро"
    location:
      type: string
      minLength: 1
      maxLength: 300
      example: "Москва, Антикафе на Арбате"
    game_number:
      type: integer
      minimum: 1
      example: 1
    duration:
      type: string
      nullable: true
      example: "01:30:00"
    notes:
      type: string
      nullable: true
      maxLength: 2000
      example: "Отличная партия, все получили удовольствие"
    players:
      type: array
      minItems: 1
      maxItems: 30
      items:
        $ref: "./requests.yaml#/PlayerImportRequest"

GamesImportRequest:
  type: object
  description: Запрос импорта нескольких партий
  required:
    - games
  properties:
    games:
      type: array
      minItems: 1
      items:
        $ref: "./requests.yaml#/GameImportRequest"

RoleImportItem:
  type: object
  description: Одна роль в запросе импорта.
  required:
    - name
    - alignment
    - role_type
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 200
      example: "Chambermaid"
    alignment:
      type: string
      pattern: "^(good|evil|neutral)$"
      example: "good"
    role_type:
      type: string
      pattern: "^(Townsfolk|Outsider|Minion|Demon|Traveller)$"
      example: "Outsider"
    description:
      type: string
      nullable: true
      maxLength: 2000
      example: "Simple, but not harmless"
    translations:
      type: object
      nullable: true
      additionalProperties:
        $ref: "./common.yaml#/RoleTranslation"
      example:
        ru:
          name: "Дамочка"
          description: "Служанка, которая следит за гостями"

RolesImportRequest:
  type: object
  description: Полный запрос импорта списка ролей.
  required:
    - roles
  properties:
    roles:
      type: array
      minItems: 1
      maxItems: 200
      items:
        $ref: "./requests.yaml#/RoleImportItem"