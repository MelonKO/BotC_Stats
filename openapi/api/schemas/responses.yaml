HealthResponse:
  type: object
  required:
    - status
    - db_connected
  properties:
    status:
      type: string
      enum: [ ok, degraded ]
      example: "ok"
    db_connected:
      type: boolean
      example: true

GameImportStatusResponse:
  type: object
  required:
    - status
    - players_created
    - errors
  properties:
    status:
      type: string
      example: "ok"
    game_id:
      type: string
      nullable: true
      example: "42"
    players_created:
      type: integer
      default: 0
      example: 5
    errors:
      type: array
      items:
        type: string
      default: [ ]

GamesImportStatusResponse:
  type: object
  properties:
    games:
      type: array
      minItems: 1
      items:
        $ref: "./responses.yaml#/GameImportStatusResponse"

RolesResponse:
  type: object
  required:
    - roles
  properties:
    roles:
      type: array
      items:
        $ref: "./common.yaml#/RoleItem"

RolesImportResponse:
  type: object
  required:
    - status
    - roles_created
    - roles_updated
    - errors
  properties:
    status:
      type: string
      example: "ok"
    roles_created:
      type: integer
      default: 0
      example: 3
    roles_updated:
      type: integer
      default: 0
      example: 1
    errors:
      type: array
      items:
        type: string
      default: [ ]

PlayersResponse:
  type: object
  required:
    - players
  properties:
    players:
      type: array
      items:
        $ref: "./common.yaml#/PlayerItem"
